<title>TPM One Team Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy plant-header band over a cool-grey floor; survey = one centred work card with sticky step footer; dashboard = summary tiles → comparison → detail → actions */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#14213A; --ink-2:#3F4D64; --muted:#677489;
  --line:#D3DAE4; --line-2:#E5E9EF;
  --brand:#14396B; --brand-2:#1C4A86; --brand-ink:#FFFFFF; --brand-mute:#B9C9E2;
  --accent:#1E5DB0; --accent-ink:#FFFFFF; --accent-soft:#E2EBF7;
  --pd:#1A4C8C; --qc:#3797D1; --en:#13857A; --ci:#6A55A8;
  --s4:#DDE4EE;
  --s1:#7F93AF; --s2:#A6B6CB; --s3:#C7D2E0;
  --seq1:#D6E2F2; --seq2:#9DBBE3; --seq3:#5689CC; --seq4:#1E4F96;
  --good:#1C7A48; --good-soft:#DFF1E6; --warn:#9A6200; --warn-soft:#FBEFD6; --bad:#B42318; --bad-soft:#FBE3DF;
  --focus:#2F7BE0; --shadow:0 1px 2px rgba(20,33,58,.06),0 4px 16px rgba(20,33,58,.05);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141F; --surface:#141E2C; --surface-2:#1A2637; --ink:#E5EBF3; --ink-2:#B7C2D2; --muted:#8B98AC;
  --line:#2A394E; --line-2:#212E40;
  --brand:#0F2848; --brand-2:#17375F; --brand-ink:#F2F6FB; --brand-mute:#8EA5C8;
  --accent:#6BA5EE; --accent-ink:#0B1626; --accent-soft:#1B3152;
  --pd:#5C94DD; --qc:#7DC5EE; --en:#3EBBA8; --ci:#B09DEB;
  --s4:#283548;
  --s1:#5F7491; --s2:#475A74; --s3:#34445A;
  --seq1:#24364F; --seq2:#33557F; --seq3:#4F82C2; --seq4:#8DB8EE;
  --good:#5DC48C; --good-soft:#15372A; --warn:#E2B04C; --warn-soft:#3A2D12; --bad:#F27D70; --bad-soft:#3E1D1A;
  --focus:#7DB3F5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141F; --surface:#141E2C; --surface-2:#1A2637; --ink:#E5EBF3; --ink-2:#B7C2D2; --muted:#8B98AC;
  --line:#2A394E; --line-2:#212E40;
  --brand:#0F2848; --brand-2:#17375F; --brand-ink:#F2F6FB; --brand-mute:#8EA5C8;
  --accent:#6BA5EE; --accent-ink:#0B1626; --accent-soft:#1B3152;
  --pd:#5C94DD; --qc:#7DC5EE; --en:#3EBBA8; --ci:#B09DEB;
  --s4:#283548;
  --s1:#5F7491; --s2:#475A74; --s3:#34445A;
  --seq1:#24364F; --seq2:#33557F; --seq3:#4F82C2; --seq4:#8DB8EE;
  --good:#5DC48C; --good-soft:#15372A; --warn:#E2B04C; --warn-soft:#3A2D12; --bad:#F27D70; --bad-soft:#3E1D1A;
  --focus:#7DB3F5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:760px;margin:0 auto}
.inner.wide{max-width:1180px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--accent)}
.top .inner{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark .badge{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;background:var(--brand-ink);color:var(--brand);padding:3px 8px;border-radius:3px}
.mark .name{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.mark .code{font-family:var(--f-mono);font-size:11px;color:var(--brand-mute);letter-spacing:.04em;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs a{color:var(--brand-mute);text-decoration:none;font-weight:500;font-size:14px;padding:6px 12px;border-radius:4px}
.tabs a[aria-current="page"]{color:var(--brand-ink);background:var(--brand-2)}
.tabs a:hover{color:var(--brand-ink)}

main{padding-block:24px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}

/* welcome */
.hero{padding:28px 24px;display:grid;gap:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(26px,5vw,34px)}
.lead{color:var(--ink-2);max-width:62ch}
.goals{display:flex;flex-wrap:wrap;gap:8px}
.goal{font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);padding:5px 12px;border-radius:999px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact{border-top:3px solid var(--accent);padding-top:10px}
.fact b{display:block;font-family:var(--f-display);font-size:16px}
.fact span{font-size:14px;color:var(--muted)}
@media (max-width:620px){.facts{grid-template-columns:1fr}}
.notice{font-size:14px;padding:10px 14px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.good{background:var(--good-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* survey */
.progress{padding:16px 20px 14px;border-bottom:1px solid var(--line-2)}
.prog-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}
.prog-row b{color:var(--ink);font-weight:600}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.steps span.on{background:var(--accent)}
.steps span.cur{background:var(--ink-2)}
.sec-head{padding:20px 20px 4px}
.sec-head h2{font-size:22px;margin-top:2px}
.sec-head p{color:var(--muted);font-size:14px;margin-top:4px}
.qs{padding:8px 20px 20px;display:grid;gap:12px}
.q{border:1px solid var(--line-2);border-radius:8px;padding:16px;background:var(--surface);scroll-margin-top:90px}
.q.missing{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.q-t{font-weight:600;display:flex;gap:10px;align-items:baseline}
.q-t .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;min-width:24px}
.q-hint{font-size:13px;color:var(--muted);margin:2px 0 0 34px}
.q-body{margin-top:12px}
.req{color:var(--bad);font-weight:600}
.q-err{display:none;color:var(--bad);font-size:13px;margin-top:8px;font-weight:500}
.q.missing .q-err{display:block}

.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lk{min-height:52px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-family:var(--f-mono);font-size:18px;font-weight:600;color:var(--ink-2)}
.lk:hover{border-color:var(--accent)}
.lk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lk-ends{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.lk-sel{font-size:13px;color:var(--accent);font-weight:600;min-height:20px;margin-top:2px;text-align:center}

.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt.multi .dot{border-radius:4px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt.multi[aria-checked="true"] .dot::after{width:10px;height:6px;border-radius:0;background:none;border:solid var(--accent-ink);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.depts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.depts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dept{display:grid;gap:2px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);border-top:4px solid var(--dc)}
.dept b{font-family:var(--f-display);font-size:24px;line-height:1.1}
.dept span{font-size:13px;color:var(--muted)}
.dept[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);border-top-color:var(--dc);box-shadow:0 0 0 1px var(--accent)}
.d-PD{--dc:var(--pd)} .d-QC{--dc:var(--qc)} .d-EN{--dc:var(--en)} .d-CI{--dc:var(--ci)}
.counter{font-size:13px;color:var(--muted);margin-bottom:8px}
textarea,.input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:10px 12px;font-size:15px}
textarea{min-height:96px;resize:vertical}
textarea:focus,.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.other-box{margin-top:8px}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:space-between;align-items:center;border-radius:0 0 8px 8px}
.foot .msg{font-size:13px;color:var(--bad);font-weight:500;text-align:center;flex:1}
.done{padding:36px 24px;display:grid;gap:14px;justify-items:start}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}

/* dashboard */
.dash{display:grid;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar h1{font-size:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.input{width:auto;padding:7px 10px;font-size:14px;background:var(--surface)}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--good)}
.status .led.off{background:var(--warn)}
.panel{padding:18px 20px}
.panel h2{font-size:18px}
.panel .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.tile{padding:16px 18px;display:grid;gap:6px;align-content:start}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:500}
.tile .big{font-family:var(--f-mono);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:15px;color:var(--muted);font-weight:500}
.split{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.split span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.bg-PD{background:var(--pd)} .bg-QC{background:var(--qc)} .bg-EN{background:var(--en)} .bg-CI{background:var(--ci)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--line-2);color:var(--muted)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.dimrow{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr) 54px 74px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.dimrow:last-child{border-bottom:0}
.dimrow .dn{font-weight:500;font-size:14px;line-height:1.35}
.dimrow .dn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.track{position:relative;height:12px;background:var(--line-2);border-radius:99px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.track .t3,.track .t4{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.55}
.dimrow .sc{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.dimrow{grid-template-columns:minmax(0,1fr) 48px 70px}.dimrow .track{grid-column:1/-1;order:3}}

.dots{position:relative;height:30px}
.dots .rail{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.dots .band{position:absolute;top:8px;height:14px;background:var(--accent-soft);border-radius:3px}
.dots .d{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dots .d.dim{opacity:.35}
.axis{position:relative;height:18px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.cmp{display:grid;grid-template-columns:minmax(140px,200px) minmax(0,1fr) 250px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.cmp:last-child{border-bottom:0}
.cmp .vals{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
@media (max-width:640px){.cmp{grid-template-columns:minmax(0,1fr)}.cmp .vals{justify-content:flex-start}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.hbar{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:7px 0}
.hbar .hl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hbar .hl .v{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.hbar .ht{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.hbar .ht i{display:block;height:100%;background:var(--s1);border-radius:99px}
.hbar.hb-top .ht i{background:var(--accent)}
.hbar .hs{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--line-2)}
.stack i{display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--f-mono);font-weight:600;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap}
.stk-row{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.stk-row .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.c-all{background:var(--accent);color:var(--accent-ink)!important}
.c-EN{background:var(--s1)} .c-PD{background:var(--s2)} .c-QC{background:var(--s3)} .c-CI{background:var(--s4)} .c-unsure{background:var(--line)}
.q1{background:var(--seq1)} .q2{background:var(--seq2)} .q3{background:var(--seq3);color:#fff!important} .q4{background:var(--seq4);color:var(--surface)!important}

.tablewrap{overflow-x:auto}
table.heat{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.heat th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.heat th:first-child{text-align:left}
.heat td{padding:6px 8px;border-bottom:1px solid var(--line-2)}
.heat td.v{text-align:center;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;border-left:2px solid var(--surface)}
.heat tr.grp td{font-weight:600;font-size:13px;color:var(--accent);padding-top:12px;border-bottom:0}
.h-good{background:var(--good-soft);color:var(--good)} .h-warn{background:var(--warn-soft);color:var(--warn)} .h-bad{background:var(--bad-soft);color:var(--bad)} .h-na{color:var(--muted)}
.flag{font-size:11px;color:var(--bad);font-weight:600;margin-left:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{font-family:var(--f-mono);margin-left:4px;opacity:.8}
.comments{display:grid;gap:8px;max-height:460px;overflow:auto;padding-right:4px}
.cm{border-left:3px solid var(--dc);background:var(--surface-2);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.cm .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.ai{white-space:pre-wrap;font-size:14px;background:var(--accent-soft);border-radius:6px;padding:12px 14px;margin-bottom:12px}

.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line-2);border-radius:8px;border-left:4px solid var(--pc)}
.act.p1{--pc:var(--bad)} .act.p2{--pc:var(--warn)} .act.p3{--pc:var(--accent)}
.act h3{font-size:16px}
.act .why{font-size:13px;color:var(--muted);margin-top:3px}
.act .how{font-size:14px;margin-top:6px}

 {k:"knowledge",n:"ความเข้าใจ TPM",items:["B1","B2","B3","B4"]},

/* ================== HELPERS ================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const num = x=>{const n=Number(x);return n>=1&&n<=5?n:null};
const mean = a=>{const v=a.filter(x=>typeof x==="number"&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const f2 = x=>x==null?"–":x.toFixed(2);
const pct = (a,b)=>b?Math.round(a/b*100):0;
function level(s){ if(s==null) return {c:"na",t:"ไม่มีข้อมูล"}; if(s>=4) return {c:"good",t:"สูง"}; if(s>=3) return {c:"warn",t:"ปานกลาง"}; return {c:"bad",t:"ต่ำ"}; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function arr(v){ if(Array.isArray(v)) return v; if(v==null||v==="") return []; return String(v).split("|").map(s=>s.trim()).filter(Boolean); }
function normalize(r){
  const o={...r};
  LIKERT_IDS.forEach(id=>o[id]=num(o[id]));
  o.G1=arr(o.G1); o.H3=arr(o.H3);
  ["dept","level","tenure","B5","C1","D5","G1_other","I1","I2","submittedAt","id","mode"].forEach(k=>{ if(o[k]==null) o[k]=""; else o[k]=String(o[k]); });
  o.dept=o.dept.toUpperCase();
  return o;
}

/* ================== STORAGE ================== */
const LOCAL_KEY="tpm-oneteam-responses-v1";
function localRead(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]"); }catch(e){ return []; } }
function localWrite(a){ try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(a)); return true; }catch(e){ return false; } }
const segSafe = s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,120)||rid();

const Store = {
  mode:"pending", db:null, user:null, uid:null, isAdmin:false, existing:null, unsub:null, adminKey:null,
  async init(){
    const inViewer = !!(window.claude && typeof window.claude.use==="function");
    this.inViewer = inViewer;
    if(!inViewer && CONFIG.SHEETS_URL){ this.mode="remote"; this.isAdmin=true; try{ this.adminKey=sessionStorage.getItem("tpm-admin-key"); }catch(e){} return; }
    if(!inViewer){ this.mode="local"; this.isAdmin=true; return; }
    try{
      const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
      this.user=user;
      if(!db){ this.mode="local"; this.isAdmin=true; return; }
      this.db=db; this.mode="cloud";
      this.isAdmin = user ? !!(await user.canEdit()) : false;
      if(!this.isAdmin && user){
        this.uid = await user.id();
        if(this.uid){ try{ const s=await db.doc("responses/"+segSafe(this.uid)).get(); if(s.exists) this.existing=s.data(); }catch(e){} }
      }
    }catch(e){ this.mode="local"; this.isAdmin=true; }
  },
  async remote(body){
    const r = await fetch(CONFIG.SHEETS_URL,{method:"POST",body:JSON.stringify(body)});
    const j = await r.json(); if(!j.ok) throw {code:j.error||"remote_error"}; return j;
  },
  async submit(resp){
    if(this.mode==="cloud"){
      const id = this.isAdmin ? "k-"+rid() : (this.uid?segSafe(this.uid):null);
      if(id){
        resp.id=id; resp.mode=this.isAdmin?"kiosk":"self";
        for(let i=0;i<2;i++){
          try{ await this.db.doc("responses/"+id).set(resp); return {where:"cloud"}; }
          catch(e){ if(e&&e.code==="unavailable"&&i===0){ await sleep(600+Math.random()*900); continue; } this.lastErr=e&&e.code; break; }
        }
      }
      resp.id="l-"+rid(); resp.mode="local"; const a=localRead(); a.push(resp); localWrite(a);
      return {where:"backup",reason:this.lastErr||"noid"};
    }
    if(this.mode==="remote"){
      resp.id="s-"+rid(); resp.mode="sheets";
      try{ await this.remote({action:"submit",response:resp}); return {where:"sheets"}; }
      catch(e){ resp.mode="local"; const a=localRead(); a.push(resp); localWrite(a); return {where:"backup",reason:"network"}; }
    }
    resp.id="l-"+rid(); resp.mode="local"; const a=localRead(); a.push(resp);
    return localWrite(a)?{where:"local"}:{where:"fail"};
  },
  watch(onData,onStatus){
    if(this.mode==="cloud"){
      if(this.unsub) return;
      onStatus("loading");
      let t=setTimeout(()=>onStatus("slow"),10000);
      this.unsub = this.db.collection("responses").onSnapshot(snap=>{
        if(!snap.metadata.fromCache){ clearTimeout(t); onStatus("live"); }
        onData(snap.docs.map(d=>normalize({...d.data(),id:d.id})));
      },err=>{ clearTimeout(t); onStatus("error",err&&err.code); this.unsub=null; });
    } else if(this.mode==="remote"){
      this.refreshRemote(onData,onStatus);
    } else { onStatus("local"); onData(localRead().map(normalize)); }
  },
  async refreshRemote(onData,onStatus){
    if(!this.adminKey){ onStatus("needkey"); onData([]); return; }
    onStatus("loading");
    try{
      const r=await fetch(CONFIG.SHEETS_URL+"?action=list&key="+encodeURIComponent(this.adminKey));
      const j=await r.json();
      if(!j.ok){ if(j.error==="bad_key"){ this.adminKey=null; try{sessionStorage.removeItem("tpm-admin-key");}catch(e){} onStatus("badkey"); onData([]); return; } throw 0; }
      onStatus("sheets"); onData(j.rows.map(normalize));
    }catch(e){ onStatus("error","network"); }
  },
  async importRows(rows,progress){
    let ok=0;
    if(this.mode==="cloud"){
      for(const r of rows){
        const id = /^[klis]-/.test(r.id||"") ? segSafe(r.id) : "i-"+(r.id?segSafe(r.id):rid());
        const body={...r,id}; delete body._t;
        try{ await this.db.doc("responses/"+id).set(body); ok++; }catch(e){ if(e&&e.code==="quota_exceeded") throw e; }
        progress&&progress(ok,rows.length);
      }
      return ok;
    }
    if(this.mode==="remote"){ const j=await this.remote({action:"import",key:this.adminKey,rows}); return j.added||0; }
    const a=localRead(); const ids=new Set(a.map(x=>x.id));
    rows.forEach(r=>{ const id=r.id||("i-"+rid()); if(!ids.has(id)){ a.push({...r,id}); ids.add(id); ok++; } });
    localWrite(a); return ok;
  },
  async deleteAll(rows,progress){
    if(this.mode==="cloud"){ let i=0; for(const r of rows){ try{ await this.db.doc("responses/"+r.id).delete(); }catch(e){} progress&&progress(++i,rows.length); } return; }
    if(this.mode==="remote"){ await this.remote({action:"clear",key:this.adminKey}); return; }
    localWrite([]);
  }
};

function validateSection(sec){
  const miss=sec.items.filter(it=>it.req&&!answered(it)).map(it=>it.id);
  miss.forEach(id=>S.missing.add(id));
  return miss;
}
function goStep(n){ S.step=n; renderSurvey(); window.scrollTo(0,0); }
async function submitSurvey(){
  for(let i=0;i<NSEC;i++){
    const miss=validateSection(SECTIONS[i]);
    if(miss.length){ goStep(i+1); setTimeout(()=>{ const el=document.getElementById("q-"+miss[0]); el&&el.scrollIntoView({block:"center"}); const m=$("#foot-msg"); if(m) m.textContent=`ยังไม่ได้ตอบ ${miss.length} ข้อในหมวดนี้`; },30); return; }
  }
  S.busy=true; renderSurvey();
  const a=S.ans;
  const resp={v:1,submittedAt:new Date().toISOString(),dept:a.dept,level:a.level,tenure:a.tenure};
  ITEMS.forEach(it=>{ if(it.type==="likert") resp[it.id]=a[it.id]; else if(it.type==="multi") resp[it.id]=arr(a[it.id]); else if(["choice"].includes(it.type)) resp[it.id]=a[it.id]; else if(it.type==="text") resp[it.id]=String(a[it.id]||"").trim().slice(0,500); });
  resp.G1_other = arr(a.G1).includes("other") ? String(a.G1_other||"").trim().slice(0,200) : "";
  S.result=await Store.submit(resp);
  if(S.result.where==="cloud"&&!Store.isAdmin) Store.existing=resp;
  S.busy=false; S.ans={}; S.missing.clear();
  goStep("done");
}

/* ================== SCORING ================== */
function respScores(r){ const o={}; DIMS.forEach(d=>o[d.k]=mean(d.items.map(i=>num(r[i])))); o.index=mean(DIMS.map(d=>o[d.k])); return o; }
function countOpts(rows,field){ const c={}; ITEM[field].opts.forEach(o=>c[o.v]=0); rows.forEach(r=>arr(r[field]).forEach(x=>{ if(x in c) c[x]++; })); return c; }
function stats(rows){
  const n=rows.length, rs=rows.map(respScores), dims={};
  DIMS.forEach(d=>dims[d.k]=mean(rs.map(s=>s[d.k])));
  const items={}; LIKERT_IDS.forEach(id=>items[id]=mean(rows.map(r=>num(r[id]))));
  return {n,dims,items,index:mean(rs.map(s=>s.index)),
    b5:rows.filter(r=>r.B5===B5_CORRECT).length, c1:countOpts(rows,"C1"), d5:countOpts(rows,"D5"),
    g1:countOpts(rows,"G1"), h3:countOpts(rows,"H3")};
}

function demoRows(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const pick=(a,w)=>{ let x=rnd()*w.reduce((s,v)=>s+v,0); for(let i=0;i<a.length;i++){ x-=w[i]; if(x<=0) return a[i]; } return a[a.length-1]; };
  const lk=b=>Math.max(1,Math.min(5,Math.round(b+(rnd()-.5)*2.2)));
  const bias={PD:{B:3.0,C:3.3,D:2.9,E:3.4,F:2.5,H:3.8},QC:{B:3.4,C:2.9,D:2.7,E:3.5,F:3.1,H:3.6},EN:{B:4.1,C:3.9,D:3.0,E:3.9,F:3.0,H:3.4},CI:{B:4.3,C:3.6,D:3.3,E:4.1,F:3.4,H:4.2}};
  const cm=["งานผลิตเร่งมาก ไม่มีเวลาทำความสะอาดเครื่องตามแผน","แจ้งซ่อมไปแล้วไม่รู้ว่าแก้เสร็จหรือยัง ไม่มีใครแจ้งกลับ","เวลามี Defect มักโทษกันว่าเป็นของแผนกไหน","อยากให้มีการอบรมการตรวจเช็คเครื่องเบื้องต้นให้ฝ่ายผลิต","อะไหล่สำรองไม่พอ ต้องรอนาน","ควรประชุมสั้น ๆ ร่วมกันทุกเช้าที่หน้าเครื่อง","หัวหน้าควรให้ความสำคัญและติดตามจริงจัง ไม่ใช่ทำตอน Audit","ไม่ชัดเจนว่า PD ต้องทำอะไร EN ต้องทำอะไร","อยากเห็นตัวเลข OEE ของไลน์ตัวเองทุกวัน","แบบฟอร์มเยอะเกินไป ควรทำให้ง่ายขึ้น","ควรมีรางวัลชื่นชมทีมที่ลด Breakdown ได้","ขอคู่มือแบบรูปภาพติดที่เครื่อง"];
  const out=[];
  for(let i=0;i<72;i++){
    const dept=pick(DEPTS,[34,18,20,8]); const b=bias[dept]; const r={id:"demo-"+i,mode:"demo",submittedAt:new Date(Date.now()-rnd()*12*864e5).toISOString(),dept,
      level:pick(["operator","leader","staff","manager"],dept==="EN"?[8,4,6,1]:dept==="CI"?[1,2,6,1]:[14,4,2,1]),tenure:pick(["lt1","y1_3","y3_5","gt5"],[2,4,3,4])};
    ["B1","B2","B3","B4"].forEach(k=>r[k]=lk(b.B-(k==="B4"?.5:0))); r.C2=lk(b.C);
    ["D1","D2","D3","D4"].forEach(k=>r[k]=lk(b.D-(k==="D3"?.3:0))); ["E1","E2","E3"].forEach(k=>r[k]=lk(b.E));
    ["F1","F2","F3","F4"].forEach(k=>r[k]=lk(b.F-(k==="F1"&&dept==="PD"?.6:0))); ["H1","H2"].forEach(k=>r[k]=lk(b.H));
    r.B5=pick(["en_job","5s","team","qc_sys","unsure"],dept==="EN"||dept==="CI"?[1,1,7,0,1]:[3,2,4,1,2]);
    r.C1=pick(["EN","PD","QC","CI","all","unsure"],dept==="QC"?[4,2,0,1,3,1]:dept==="PD"?[5,1,0,1,4,1]:dept==="CI"?[1,1,0,1,7,0]:[1,2,0,1,6,1]);
    r.D5=pick(["none","few","some","weekly"],dept==="EN"||dept==="CI"?[1,3,3,3]:[3,4,2,1]);
    const g=new Set(); const gw=dept==="PD"?[6,3,3,3,4,2,2,2,1,2]:dept==="QC"?[2,2,4,5,4,1,4,2,1,1]:[3,2,4,4,2,4,2,2,1,2];
    while(g.size<1+Math.floor(rnd()*3)) g.add(pick(ITEM.G1.opts.slice(0,10).map(o=>o.v),gw)); r.G1=[...g]; r.G1_other="";
    const h=new Set(); while(h.size<1+Math.floor(rnd()*2)) h.add(pick(ITEM.H3.opts.map(o=>o.v),[4,4,3,3,2,2])); r.H3=[...h];
    r.I1=rnd()<.45?cm[Math.floor(rnd()*cm.length)]:""; r.I2=rnd()<.3?cm[Math.floor(rnd()*cm.length)]:"";
    out.push(normalize(r));
  }
  return out;
}

const COLS_ORDER=["id","submittedAt","mode","dept","level","tenure","B1","B2","B3","B4","B5","C1","C2","D1","D2","D3","D4","D5","E1","E2","E3","F1","F2","F3","F4","G1","G1_other","H1","H2","H3","I1","I2"];
const SCORE_COLS=[...DIMS.map(d=>"S_"+d.k),"S_index"];
function csvCell(v){ const s=v==null?"":String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function buildCSV(rows){
  const head=[...COLS_ORDER,"B5_correct",...SCORE_COLS];
  const lines=[head.join(",")];
  rows.forEach(r=>{ const sc=respScores(r); lines.push([...COLS_ORDER.map(c=>Array.isArray(r[c])?r[c].join("|"):r[c]),r.B5===B5_CORRECT?1:0,...DIMS.map(d=>sc[d.k]==null?"":sc[d.k].toFixed(2)),sc.index==null?"":sc.index.toFixed(2)].map(csvCell).join(",")); });
  return "﻿"+lines.join("\r\n");
}
function parseCSV(text){
  text=text.replace(/^﻿/,""); const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===","){row.push(cell);cell="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift()||[]; return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),r[i]??""])));
}

  const lab=(q,v)=>Array.isArray(v)?v.map(x=>q==="G1"&&x==="other"?"อื่น ๆ":optLabel(q,x)).join(" | "):(ITEM[q]&&ITEM[q].opts?optLabel(q,v):v);
  const head=["รหัสคำตอบ","วันที่ส่ง","แผนก","ระดับงาน","อายุงาน",...COLS_ORDER.slice(6).map(c=>c==="G1_other"?"G1 อื่น ๆ (ระบุ)":c+" "+(ITEM[c]?ITEM[c].t:"")),"B5 ตอบถูก",...DIMS.map(d=>"คะแนน "+d.n),"One Team Index"];
  const data=[head,...rows.map(r=>{ const sc=respScores(r); return [r.id,r.submittedAt?new Date(r.submittedAt).toLocaleString("th-TH"):"",r.dept,lab("level",r.level),lab("tenure",r.tenure),...COLS_ORDER.slice(6).map(c=>c==="G1_other"?r.G1_other:ITEM[c].type==="likert"?r[c]:lab(c,r[c])),r.B5===B5_CORRECT?"ถูก":"ไม่ถูก",...DIMS.map(d=>sc[d.k]==null?"":+sc[d.k].toFixed(2)),sc.index==null?"":+sc.index.toFixed(2)]; })];
  const groups=[["ทั้งหมด",rows],...DEPTS.map(d=>[d,rows.filter(r=>r.dept===d)])].map(([n,rs])=>[n,stats(rs)]);
  const sum=[["ตัวชี้วัด",...groups.map(g=>g[0])],["จำนวนผู้ตอบ",...groups.map(g=>g[1].n)],...DIMS.map(d=>[d.n,...groups.map(g=>g[1].dims[d.k]==null?"":+g[1].dims[d.k].toFixed(2))]),["One Team Index",...groups.map(g=>g[1].index==null?"":+g[1].index.toFixed(2))],["% เข้าใจ TPM ถูกต้อง (B5)",...groups.map(g=>pct(g[1].b5,g[1].n))],["% มองว่าเป็นงานของทุกแผนก (C1)",...groups.map(g=>pct(g[1].c1.all,g[1].n))],[],["รายข้อ"],...LIKERT_IDS.map(id=>[id+" "+ITEM[id].s,...groups.map(g=>g[1].items[id]==null?"":+g[1].items[id].toFixed(2))]),[],["อุปสรรค (% ผู้ตอบ)"],...ITEM.G1.opts.map(o=>[o.l,...groups.map(g=>pct(g[1].g1[o.v],g[1].n))])];
  const code=[["คำถาม","รหัส","ความหมาย"],...ITEMS.filter(i=>i.opts&&i.type!=="dept").flatMap(i=>i.opts.map(o=>[i.id+" "+i.t,o.v,o.l])),["มาตราส่วน 1–5","1–5",LK.map((l,i)=>(i+1)+"="+l).join(", ")]];
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(data); ws1["!cols"]=head.map((h,i)=>({wch:i<5?14:Math.min(40,Math.max(10,String(h).length*0.8))}));
  XLSX.utils.book_append_sheet(wb,ws1,"คำตอบ");
  const ws2=XLSX.utils.aoa_to_sheet(sum); ws2["!cols"]=[{wch:40},{wch:10},{wch:10},{wch:10},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws2,"สรุปคะแนนตามแผนก");
  const ws3=XLSX.utils.aoa_to_sheet(code); ws3["!cols"]=[{wch:60},{wch:12},{wch:44}]; XLSX.utils.book_append_sheet(wb,ws3,"รหัสคำตอบ");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  await saveFile(`TPM-One-Team-${new Date().toISOString().slice(0,10)}.xlsx`,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),buildCSV(rows));
}
async function importFile(file){
  const msg=$("#mg-msg"); const text=await file.text(); let rows=parseCSV(text);
  rows=rows.filter(r=>r.dept&&DEPTS.includes(String(r.dept).toUpperCase())).map(r=>{ const o={}; COLS_ORDER.forEach(c=>o[c]=r[c]); return normalize(o); });
  if(!rows.length){ msg.textContent="ไม่พบข้อมูลที่นำเข้าได้ ไฟล์ต้องเป็น CSV ที่ส่งออกจากแบบสำรวจนี้"; return; }
  const exist=new Set(D.rows.map(r=>r.id)); const fresh=rows.filter(r=>!r.id||!exist.has(r.id));
  msg.textContent=`กำลังนำเข้า ${fresh.length} รายการ…`;
  try{ const n=await Store.importRows(fresh,(a,b)=>{msg.textContent=`กำลังนำเข้า ${a} / ${b}`;}); msg.textContent=`นำเข้าแล้ว ${n} รายการ${rows.length-fresh.length?` (ข้าม ${rows.length-fresh.length} รายการที่มีอยู่แล้ว)`:""}`; toast("นำเข้า "+n+" รายการ"); refreshData(); }
  catch(e){ msg.textContent=e&&e.code==="quota_exceeded"?"พื้นที่ฐานข้อมูลเต็ม ลบข้อมูลเก่าบางส่วนก่อนนำเข้า":"นำเข้าไม่สำเร็จ ลองอีกครั้ง"; }
}
function refreshData(){ if(Store.mode==="local") { D.rows=localRead().map(normalize); render(); } else if(Store.mode==="remote") Store.refreshRemote(onData,onStatus); }

  const rows=filtered(); const list=[]; rows.forEach(r=>["I1","I2"].forEach(k=>{ const t=String(r[k]||"").trim(); if(t) list.push(`[${r.dept}][${k==="I1"?"ปัญหา":"ข้อเสนอแนะ"}] ${t}`); }));

  D.aiBusy=true; render();
  const prompt=`คุณเป็นที่ปรึกษา TPM ในโรงงานอุตสาหกรรม ด้านล่างคือความคิดเห็นปลายเปิดจากแบบสำรวจ "TPM One Team" ของพนักงานแผนก PD (ผลิต), QC (ควบคุมคุณภาพ), EN (วิศวกรรม), CI (พัฒนาปรับปรุงต่อเนื่อง) แต่ละบรรทัดขึ้นต้นด้วย [แผนก][ประเภท]

สรุปเป็นภาษาไทย ข้อความธรรมดา ไม่ใช้ markdown ไม่ใส่ * หรือ # ใช้รูปแบบนี้:

• (3 ข้อ สั้น ชัด ระบุว่าใครควรทำ)

ห้ามยกข้อความที่อาจระบุตัวบุคคล ห้ามแต่งข้อมูลที่ไม่มีในความคิดเห็น

ความคิดเห็น (${list.length} รายการ):
${list.slice(0,300).join("\n")}`;
  try{
    const res=await sample(prompt,{modelTier:"default",onText:({text})=>{ D.ai[key]=text; const b=$("#ai-box"); if(b) b.textContent=text; }});
    D.ai[key]=res.text;
  }catch(e){ if(e&&e.code==="not_granted") D.sampleOk=false; toast(e&&e.code==="rate_limited"?"เรียกใช้บ่อยเกินไป รอสักครู่แล้วลองใหม่":"สรุปไม่สำเร็จ"); }

/* ================== ROUTING & EVENTS ================== */
function onData(rows){ D.rows=rows.sort((a,b)=>String(a.submittedAt).localeCompare(String(b.submittedAt))); if(route()==="dashboard") render(); }
function onStatus(s,code){ D.status=s; D.statusCode=code||""; if(route()==="dashboard") render(); }
function route(){ return location.hash.replace("#","")==="dashboard"?"dashboard":"survey"; }
let watching=false;
function render(){
  const r=route();
  $("#tab-dash").hidden=!Store.isAdmin;
  $("#tab-survey").setAttribute("aria-current",r==="survey"?"page":"false");
  $("#tab-dash").setAttribute("aria-current",r==="dashboard"?"page":"false");
  if(r==="dashboard"){
    if(Store.isAdmin&&!watching&&Store.mode!=="pending"){ watching=true; Store.watch(onData,onStatus); }
    const y=window.scrollY; renderDashboard(); window.scrollTo(0,y);
  } else renderSurvey();
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-act]"); if(!t) return;
  if(t.matches(".lk,.opt:not(.multi),.dept")&&t.dataset.q){ const q=t.dataset.q, v=ITEM[q].type==="likert"?Number(t.dataset.v):t.dataset.v; S.ans[q]=v; S.missing.delete(q); refreshQ(q); const nb=document.querySelector(`#q-${q} [data-v="${t.dataset.v}"]`); nb&&nb.focus(); return; }
  if(t.dataset.m){ const q=t.dataset.m, it=ITEM[q]; let sel=arr(S.ans[q]); const v=t.dataset.v; sel=sel.includes(v)?sel.filter(x=>x!==v):(sel.length<it.max?[...sel,v]:sel); S.ans[q]=sel; if(answered(it)) S.missing.delete(q); refreshQ(q); const nb=document.querySelector(`#q-${q} [data-v="${v}"]`); nb&&nb.focus(); if(v==="other"&&sel.includes("other")){ const inp=document.getElementById("f-"+q+"_other"); inp&&inp.focus(); } return; }
  if(t.dataset.dept){ D.dept=t.dataset.dept; D.theme="all"; render(); return; }
  if(t.dataset.theme){ D.theme=t.dataset.theme; render(); return; }
  const act=t.dataset.act; if(!act) return;
  if(act==="close-modal"&&e.target!==t&&!e.target.matches("button")) return;
  switch(act){
    case "start": S.missing.clear(); goStep(1); break;
    case "next": { const sec=SECTIONS[S.step-1]; const miss=validateSection(sec); if(miss.length){ renderSurvey(); const el=document.getElementById("q-"+miss[0]); el&&el.scrollIntoView({block:"center",behavior:"smooth"}); $("#foot-msg").textContent=`ยังไม่ได้ตอบ ${miss.length} ข้อ`; } else goStep(S.step+1); break; }
    case "back": goStep(S.step-1); break;
    case "submit": if(!S.busy) submitSurvey(); break;
    case "restart": S.result=null; goStep(0); break;
    case "demo-on": D.demo=true; D.theme="all"; location.hash="dashboard"; render(); break;
    case "demo-off": D.demo=false; D.theme="all"; render(); break;
    case "csv": await saveFile(`TPM-One-Team-${new Date().toISOString().slice(0,10)}.csv`,new Blob([buildCSV(D.rows)],{type:"text/csv"}),buildCSV(D.rows)); break;
    case "xlsx": await exportXLSX(); break;
    case "ai": if(!D.aiBusy) aiSummary(); break;
    case "reload": refreshData(); break;
    case "logout": Store.adminKey=null; try{sessionStorage.removeItem("tpm-admin-key");}catch(_){} D.rows=[]; D.status="needkey"; render(); break;
    case "del-ask": D.confirmDel=true; render(); break;
    case "del-cancel": D.confirmDel=false; render(); break;
    case "del-go": { const v=($("#del-confirm")||{}).value; if((v||"").trim()!=="ลบ"){ $("#mg-msg").textContent="พิมพ์คำว่า ลบ ให้ถูกต้องก่อนกดยืนยัน"; return; } const m=$("#mg-msg"); m.textContent="กำลังลบ…"; await Store.deleteAll(D.rows,(a,b)=>{ const x=$("#mg-msg"); if(x) x.textContent=`กำลังลบ ${a} / ${b}`; }); D.confirmDel=false; toast("ลบคำตอบทั้งหมดแล้ว"); refreshData(); render(); break; }
    case "upload-backup": { const b=localRead(); const m=$("#mg-msg"); m.textContent="กำลังอัปโหลด…"; try{ const n=await Store.importRows(b.map(normalize)); localWrite([]); toast("อัปโหลด "+n+" รายการแล้ว"); }catch(_){ m.textContent="อัปโหลดไม่สำเร็จ"; } render(); break; }
    case "copy": { const ta=$("#copy-area"); try{ await navigator.clipboard.writeText(ta.value); toast("คัดลอกแล้ว"); }catch(_){ ta.focus(); ta.select(); toast("เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก"); } break; }
    case "close-modal": $("#overlay").innerHTML=""; break;
  }
});
document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.text; if(k){ S.ans[k]=e.target.value; const base=k.replace("_other",""); if(ITEM[base]&&answered(ITEM[base])&&S.missing.has(base)){ S.missing.delete(base); document.getElementById("q-"+base).classList.remove("missing"); } } });
document.addEventListener("change",e=>{ if(e.target.id==="f-level"){ D.lvl=e.target.value; render(); } if(e.target.id==="csvfile"&&e.target.files[0]){ importFile(e.target.files[0]); e.target.value=""; } });
document.addEventListener("submit",e=>{ if(e.target.id==="keyform"){ e.preventDefault(); const k=$("#adminkey").value.trim(); if(!k) return; Store.adminKey=k; try{sessionStorage.setItem("tpm-admin-key",k);}catch(_){} watching=false; D.status="loading"; render(); } });

(async function boot(){
  render();
  await Store.init();
  render();
})();
</script>
